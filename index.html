<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0D1117" />
    <meta
      name="description"
      content="Diseña la distribución de espacios de tu vivienda por piso en un lienzo 2D."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>Planos 2D — Diseñador de Espacios</title>
  </head>
  <body class="bg-base-900 text-ink-100 overscroll-none">
    <div id="root"></div>
    <!-- Aplica el tema ANTES del primer render para evitar flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('floorplan-theme');
          if (t === 'light') document.documentElement.classList.remove('dark');
          // Si es 'dark' o sin preferencia, el class="dark" del HTML ya está activo
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
